<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>REAL HUB | ระบบจัดการคีย์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&family=Kanit:wght@500;600;700;800&family=Orbitron:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: dark;
  --bg: #050304;
  --panel: rgba(22,14,15,.78);
  --panel-2: rgba(40,24,26,.85);
  --ink: #f2eae3;
  --muted: #a6978d;
  --gold: #c9ced6;
  --gold-line: rgba(220,225,233,.42);
  --line: rgba(255,255,255,.14);
  --shu: #d4141e;
  --shu-hi: #ff2a36;
  --sakura: #ffb7c8;
  --ok: #9fcf86; --ok-bg: rgba(159,207,134,.12);
  --bad: #ff6b66; --bad-bg: rgba(255,107,102,.13);
  --perm: #dfe3ea; --perm-bg: rgba(223,227,234,.12);
  --track: rgba(255,255,255,.09);
  --serif: "Kanit", "IBM Plex Sans Thai", sans-serif;
}
html { height: 100%; background: #050304; scroll-padding-top: env(safe-area-inset-top, 0px); }
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100%; color: var(--ink);
  background:
    radial-gradient(800px 420px at 50% -8%, rgba(212,20,30,.38), transparent 70%),
    radial-gradient(500px 360px at 0% 100%, rgba(255,183,200,.07), transparent 70%),
    radial-gradient(circle at 50% 100%, transparent 0 14px, rgba(255,40,50,.05) 14px 15px, transparent 15px 28px, rgba(255,40,50,.05) 28px 29px, transparent 29px 42px, rgba(255,40,50,.05) 42px 43px, transparent 43px),
    #050304;
  background-size: auto, auto, 60px 30px, auto;
  background-attachment: fixed;
  font-family: "Prompt", "Noto Sans Thai", system-ui, sans-serif;
  font-size: 16px; line-height: 1.55;
}
#sakura { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
.wrap { position: relative; z-index: 1; max-width: 760px; margin: 0 auto; padding: 30px 16px 56px; }

.hero { text-align: center; position: relative; padding: 6px 0 8px; }
.logo {
  display: block; width: 290px; max-width: 80%; aspect-ratio: 1; margin: -6px auto -8px;
  -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 52%, transparent 71%);
  mask-image: radial-gradient(circle at 50% 50%, #000 52%, transparent 71%);
  filter: drop-shadow(0 0 22px rgba(255,30,40,.5));
}
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
h1 { font-family: var(--serif); font-size: 24px; margin: 0 0 2px; font-weight: 700; letter-spacing: .06em; color: var(--ink); position: relative; }
.sub { color: var(--muted); margin: 0; }

.panel {
  position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 20px 18px 18px; margin-bottom: 16px;
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); box-shadow: 0 14px 40px rgba(0,0,0,.55);
}
.panel::before, .panel::after { content: ""; position: absolute; width: 16px; height: 16px; border: 2px solid var(--gold); pointer-events: none; }
.panel::before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; }
.panel::after { bottom: -1px; right: -1px; border-left: 0; border-top: 0; }
h2 { font-family: var(--serif); font-size: 19px; margin: 0 0 14px; font-weight: 700; padding-left: 12px; border-left: 4px solid var(--shu); line-height: 1.2; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  border: 1px solid var(--line); background: rgba(255,255,255,.03); color: var(--ink);
  padding: 9px 16px; border-radius: 4px; font: inherit; font-weight: 500; cursor: pointer;
  transition: transform .15s, background .15s, box-shadow .15s;
}
.chip:hover { background: rgba(255,255,255,.07); border-color: var(--gold-line); }
.chip:active { transform: scale(.96); }
.chip[aria-pressed="true"] { background: var(--shu); color: #fff; border-color: var(--gold); font-weight: 600; box-shadow: 0 0 20px rgba(196,38,43,.55); }
.chip.perm[aria-pressed="true"] { background: linear-gradient(135deg, #f4f6fa, #aab1bd); color: #14161a; box-shadow: 0 0 20px rgba(220,225,233,.45); }

.row { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
.field { flex: 1 1 140px; min-width: 0; }
.field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
input[type=text], input[type=number] {
  width: 100%; padding: 11px 13px; border: 1px solid var(--line); border-radius: 4px;
  background: rgba(0,0,0,.5); color: var(--ink); font: inherit;
}
input::placeholder { color: #6d5f57; }
input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(255,255,255,.12); outline: none; }
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.btn {
  border: 1px solid var(--gold); border-radius: 4px; padding: 12px 20px; font: inherit; font-weight: 600; cursor: pointer;
  background: linear-gradient(180deg, var(--shu-hi), var(--shu)); color: #fff;
  box-shadow: 0 6px 22px rgba(196,38,43,.4); transition: transform .15s, filter .15s;
}
.btn:hover { filter: brightness(1.1); }
.btn:active { transform: scale(.98); }
.btn.ghost { background: rgba(255,255,255,.04); color: var(--ink); border-color: var(--line); box-shadow: none; }
.btn.ghost:hover { background: rgba(255,255,255,.09); border-color: var(--gold-line); }
.btn.danger { background: #3a0e10; color: #ff9d98; border-color: rgba(255,107,102,.55); box-shadow: none; }
.btn.small { padding: 8px 14px; font-size: 14px; }
.btn.block { width: 100%; font-family: var(--serif); font-size: 18px; font-weight: 700; padding: 14px; letter-spacing: .04em; }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 18px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-top: 3px solid var(--gold); border-radius: 4px; padding: 10px 6px; text-align: center; }
.stat b { display: block; font-family: "Orbitron", sans-serif; font-size: 28px; line-height: 1.3; font-weight: 800; }
.stat span { font-size: 12.5px; color: var(--muted); }
.stat.ok { border-top-color: var(--ok); } .stat.ok b { color: var(--ok); }
.stat.bad { border-top-color: var(--bad); } .stat.bad b { color: var(--bad); }
.stat.perm b { color: var(--perm); }

.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.tab { border: 0; border-bottom: 2px solid transparent; background: transparent; color: var(--muted); font: inherit; font-weight: 500; padding: 7px 12px; cursor: pointer; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--shu-hi); }

.key {
  position: relative; border: 1px solid var(--line); border-radius: 6px; padding: 15px 16px 14px 20px; margin-bottom: 12px; overflow: hidden;
  background: linear-gradient(135deg, var(--panel-2), var(--panel));
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); box-shadow: 0 8px 28px rgba(0,0,0,.5);
}
.key::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--c); box-shadow: 0 0 14px var(--c); }
.key::after {
  content: ""; position: absolute; right: -26px; top: -26px; width: 80px; height: 80px; border-radius: 50%;
  border: 1px solid var(--c); opacity: .22; box-shadow: 0 0 0 10px transparent, inset 0 0 0 10px transparent;
}
.key.active { --c: var(--ok); } .key.expired { --c: var(--bad); } .key.permanent { --c: var(--perm); }
.key.expired .code { text-decoration: line-through; text-decoration-color: var(--bad); color: var(--muted); }
.top { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.code { font-family: "Orbitron", "Kanit", sans-serif; font-weight: 700; font-size: 15.5px; letter-spacing: .09em; word-break: break-all; }
.badge {
  font-family: var(--serif); font-size: 14px; font-weight: 800; padding: 2px 10px; border: 2px solid currentColor; border-radius: 3px;
  white-space: nowrap; transform: rotate(-3deg); letter-spacing: .04em;
}
.badge.active { background: var(--ok-bg); color: var(--ok); }
.badge.expired { background: var(--bad-bg); color: var(--bad); }
.badge.permanent { background: var(--perm-bg); color: var(--perm); }
.meta { color: var(--muted); font-size: 14px; margin-top: 6px; }
.meta strong { color: var(--ink); font-weight: 500; }
.bar { height: 6px; background: var(--track); border-radius: 2px; overflow: hidden; margin-top: 10px; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--shu-hi), var(--gold)); }
.actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.empty { text-align: center; color: var(--muted); padding: 34px 8px; font-family: var(--serif); font-size: 17px; }
.result { margin-top: 12px; padding: 11px 14px; border-radius: 4px; font-weight: 500; border: 1px solid currentColor; }
.result.active { background: var(--ok-bg); color: var(--ok); }
.result.expired { background: var(--bad-bg); color: var(--bad); }
.result.permanent { background: var(--perm-bg); color: var(--perm); }
.result.none { background: rgba(255,255,255,.04); color: var(--muted); border-color: var(--line); }
.me { color: var(--muted); font-size: 14px; margin: 0 0 12px; }
.me strong { color: var(--ink); font-weight: 500; }
.dev { color: var(--muted); font-size: 14px; margin-top: 6px; }
.dev strong { color: var(--ink); font-weight: 500; }
.dev.locked strong { color: var(--shu-hi); }
.gate { position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center; padding: 20px;
  background: rgba(5,3,4,.9); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
body:not(.locked) .gate { display: none; }
body.locked .wrap { visibility: hidden; }
.gate-box { width: 100%; max-width: 360px; text-align: center; }
.gate-logo { width: 180px; max-width: 60%; aspect-ratio: 1; display: block; margin: 0 auto 4px;
  -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 52%, transparent 71%); mask-image: radial-gradient(circle at 50% 50%, #000 52%, transparent 71%);
  filter: drop-shadow(0 0 22px rgba(255,30,40,.5)); }
.steps { display: flex; justify-content: center; gap: 8px; margin: 6px 0 14px; }
.steps span { width: 34px; height: 4px; border-radius: 2px; background: var(--track); }
.steps span.on { background: var(--shu-hi); box-shadow: 0 0 10px var(--shu); }
.gate h2 { border: 0; padding: 0; margin: 0 0 4px; font-size: 22px; }
.gate .me { margin-bottom: 14px; }
.gate input { text-align: center; font-size: 18px; letter-spacing: .08em; }
.conn { font-size: 13px; margin: 0 0 6px; color: var(--muted); min-height: 20px; }
.conn.ok { color: var(--ok); } .conn.no { color: var(--bad); }
.gerr { min-height: 22px; margin: 8px 0; color: var(--bad); font-size: 14px; }
.gate-box.shake { animation: shake .35s; }
@keyframes shake { 20%,60% { transform: translateX(-8px); } 40%,80% { transform: translateX(8px); } }
@media (prefers-reduced-motion: reduce) { .gate-box.shake { animation: none; } }
.bulk { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 22px; }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  background: #1a0f10; color: var(--ink); border: 1px solid var(--gold); padding: 10px 20px; border-radius: 4px; font-weight: 500;
  box-shadow: 0 0 24px rgba(196,38,43,.4); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 30; max-width: 90vw; text-align: center;
}
.toast.show { opacity: 1; }
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.75); -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 40; }
.modal-bg.show { display: flex; }
.modal { background: #150c0d; border: 1px solid var(--gold); border-radius: 6px; padding: 22px; max-width: 380px; width: 100%; box-shadow: 0 0 60px rgba(196,38,43,.3); }
.modal p { margin: 0 0 18px; }
.modal .row { margin: 0; justify-content: flex-end; }
@media (max-width: 420px) { h1 { font-size: 20px; } .logo { width: 240px; } }
@media (prefers-reduced-motion: reduce) { .toast, .chip, .btn { transition: none; } }
</style>
</head>
<body class="locked">
<canvas id="sakura" aria-hidden="true"></canvas>
<div class="gate" id="gate" role="dialog" aria-modal="true" aria-labelledby="gTitle">
  <div class="gate-box" id="gBox">
    <img id="gateLogo" class="gate-logo" alt="REAL HUB">
    <p class="conn" id="conn" aria-live="polite">กำลังเช็กการเชื่อมต่อเซิร์ฟเวอร์...</p>
    <div class="steps" aria-hidden="true"><span id="s1" class="on"></span><span id="s2"></span></div>
    <h2 id="gTitle">ด่านที่ 1 จาก 2</h2>
    <p class="me" id="gHint">ใส่คีย์ชั้นแรก</p>
    <input type="password" id="gIn" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="คีย์" aria-label="คีย์เข้าสู่ระบบ">
    <div class="gerr" id="gErr" aria-live="polite"></div>
    <button class="btn block" id="gBtn">ถัดไป</button>
  </div>
</div>
<div class="wrap">
  <header class="hero">
    <img class="logo" alt="REAL HUB" src="logo.webp">
    <h1 class="sr">REAL HUB</h1>
  </header>

  <section class="panel" aria-labelledby="h-gen">
    <h2 id="h-gen">สร้างคีย์ใหม่</h2>
    <div class="chips" id="durations" role="group" aria-label="ระยะเวลาคีย์"></div>
    <div class="row">
      <div class="field">
        <label for="qty">จำนวนคีย์</label>
        <input type="number" id="qty" min="1" max="100" value="1" inputmode="numeric">
      </div>
      <div class="field" style="flex:2 1 200px">
        <label for="note">ชื่อ/หมายเหตุ (ไม่บังคับ)</label>
        <input type="text" id="note" maxlength="60" placeholder="เช่น ลูกค้า A">
      </div>
    </div>
    <div class="row"><button class="btn block" id="gen">สร้างคีย์</button></div>
  </section>


  <div class="stats" id="stats"></div>

  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="field" style="margin-bottom:12px"><input type="text" id="search" placeholder="ค้นหาคีย์หรือหมายเหตุ" aria-label="ค้นหา"></div>
  <div id="list"></div>

  <div class="bulk">
    <button class="btn ghost small" id="lockPage">ล็อกหน้า</button>
    <button class="btn ghost small" id="delExpired">ลบคีย์ที่หมดอายุทั้งหมด</button>
    <button class="btn danger small" id="resetAll">รีเซ็ตทั้งหมด</button>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>
<div class="modal-bg" id="modalBg">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalText">
    <p id="modalText"></p>
    <div class="row">
      <button class="btn ghost small" id="mNo">ยกเลิก</button>
      <button class="btn danger small" id="mYes">ยืนยัน</button>
    </div>
  </div>
</div>

<script>
(function () {
  var DURATIONS = [
    { d: 1, label: "1 วัน" }, { d: 2, label: "2 วัน" }, { d: 3, label: "3 วัน" }, { d: 4, label: "4 วัน" },
    { d: 5, label: "5 วัน" }, { d: 7, label: "7 วัน" }, { d: 10, label: "10 วัน" }, { d: 30, label: "30 วัน" },
    { d: 0, label: "ถาวร" }
  ];
  var TOKEN = null, offset = 0, keys = [], selected = 1, filter = "all", query = "", loadTimer = null;
  try { TOKEN = sessionStorage.getItem("rh.token"); } catch (e) {}
  function $(id) { return document.getElementById(id); }
  function nowMs() { return Date.now() + offset; }

  function api(method, path, body) {
    return fetch(path, {
      method: method,
      headers: { "Content-Type": "application/json", "x-token": TOKEN || "" },
      body: body ? JSON.stringify(body) : undefined
    }).then(function (r) {
      return r.json().catch(function () { return { ok: false }; }).then(function (j) {
        j._s = r.status;
        if (r.status === 401 && path.indexOf("/api/admin/step") < 0) relock();
        return j;
      });
    }).catch(function () { return { ok: false, msg: "เชื่อมต่อเซิร์ฟเวอร์ไม่ได้", _s: 0 }; });
  }

  // ---------- helpers ----------
  function errMsg(j, dflt) {
    if (j.msg) return j.msg;
    var s = j._s;
    if (s === 0) return "เชื่อมต่อเซิร์ฟเวอร์คีย์ไม่ได้ (ตรวจว่าเปิดผ่านลิงก์ของโฮสต์ที่รัน server.js)";
    if (s === 404 || s === 405) return "หน้านี้ไม่ได้ต่อกับเซิร์ฟเวอร์คีย์ (HTTP " + s + ") ต้องเปิดผ่านลิงก์ที่โฮสต์รัน server.js ไม่ใช่ GitHub Pages หรือไฟล์ในเครื่อง";
    if (s >= 500) return "เซิร์ฟเวอร์ยังไม่พร้อม (HTTP " + s + ") รอ 1 นาทีแล้วลองใหม่ โฮสต์ฟรีอาจกำลังตื่นหรือเซิร์ฟเวอร์เปิดไม่ติด";
    return dflt + (s ? " (HTTP " + s + ")" : "");
  }
  function status(k, now) { if (!k.days) return "permanent"; return now >= k.expiresAt ? "expired" : "active"; }
  function fmt(ts) { return new Date(ts).toLocaleString("th-TH", { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" }) + " น."; }
  function dur(ms) {
    var s = Math.max(0, Math.floor(ms / 1000)), d = Math.floor(s / 86400); s -= d * 86400;
    var h = Math.floor(s / 3600); s -= h * 3600; var m = Math.floor(s / 60); s -= m * 60;
    if (d > 0) return d + " วัน " + h + " ชม. " + m + " นาที";
    if (h > 0) return h + " ชม. " + m + " นาที " + s + " วินาที";
    if (m > 0) return m + " นาที " + s + " วินาที";
    return s + " วินาที";
  }
  function ago(ms) {
    var s = Math.floor(ms / 1000); if (s < 60) return "เมื่อสักครู่";
    var m = Math.floor(s / 60); if (m < 60) return m + " นาทีที่แล้ว";
    var h = Math.floor(m / 60); if (h < 24) return h + " ชั่วโมงที่แล้ว";
    return Math.floor(h / 24) + " วันที่แล้ว";
  }
  function esc(t) { return String(t).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  var toastTimer;
  function toast(msg) { var t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove("show"); }, 2200); }
  var onYes = null;
  function confirmBox(text, cb) { $("modalText").textContent = text; onYes = cb; $("modalBg").classList.add("show"); $("mNo").focus(); }
  $("mNo").onclick = function () { $("modalBg").classList.remove("show"); onYes = null; };
  $("mYes").onclick = function () { $("modalBg").classList.remove("show"); var f = onYes; onYes = null; if (f) f(); };
  function copy(text) {
    function fb() {
      var ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); toast("คัดลอกแล้ว"); } catch (e) { toast("คัดลอกไม่สำเร็จ"); }
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { toast("คัดลอกแล้ว"); }, fb); else fb();
  }

  // ---------- data ----------
  function load() {
    return api("GET", "/api/keys").then(function (j) {
      if (!j.ok) { if (j._s !== 401) toast(errMsg(j, "โหลดข้อมูลไม่สำเร็จ")); return; }
      keys = j.keys; offset = j.now - Date.now(); render();
    });
  }
  function startLoading() { load(); clearInterval(loadTimer); loadTimer = setInterval(load, 15000); }

  function renderChips() {
    $("durations").innerHTML = DURATIONS.map(function (o) {
      return '<button class="chip' + (o.d === 0 ? " perm" : "") + '" data-d="' + o.d + '" aria-pressed="' + (o.d === selected) + '">' + o.label + "</button>";
    }).join("");
  }
  $("durations").addEventListener("click", function (e) { var b = e.target.closest(".chip"); if (!b) return; selected = parseInt(b.dataset.d, 10); renderChips(); });

  $("gen").onclick = function () {
    var btn = $("gen"); btn.disabled = true;
    api("POST", "/api/keys", { days: selected, qty: parseInt($("qty").value, 10) || 1, note: $("note").value.trim() }).then(function (j) {
      btn.disabled = false;
      if (!j.ok) return toast(errMsg(j, "สร้างคีย์ไม่สำเร็จ"));
      load();
      if (j.made.length === 1) copy(j.made[0]); else toast("สร้าง " + j.made.length + " คีย์แล้ว");
    });
  };

  function counts(now) { var c = { all: keys.length, active: 0, expired: 0, permanent: 0 }; keys.forEach(function (k) { c[status(k, now)]++; }); return c; }
  var TABS = [["all", "ทั้งหมด"], ["active", "ยังไม่หมดอายุ"], ["expired", "หมดอายุแล้ว"], ["permanent", "ถาวร"]];
  function pct(k, now) { var t = k.expiresAt - k.createdAt; return Math.max(0, Math.min(100, ((k.expiresAt - now) / t) * 100)).toFixed(1); }

  function render() {
    var now = nowMs(), c = counts(now);
    $("stats").innerHTML =
      '<div class="stat ok"><b>' + c.active + "</b><span>ยังใช้ได้</span></div>" +
      '<div class="stat bad"><b>' + c.expired + "</b><span>หมดอายุ</span></div>" +
      '<div class="stat perm"><b>' + c.permanent + "</b><span>ถาวร</span></div>";
    $("tabs").innerHTML = TABS.map(function (t) {
      return '<button class="tab" role="tab" data-f="' + t[0] + '" aria-selected="' + (filter === t[0]) + '">' + t[1] + " (" + c[t[0]] + ")</button>";
    }).join("");
    var q = query.trim().toLowerCase();
    var list = keys.filter(function (k) {
      if (filter !== "all" && status(k, now) !== filter) return false;
      if (q && k.key.toLowerCase().indexOf(q) < 0 && (k.note || "").toLowerCase().indexOf(q) < 0 && ((k.lock && k.lock.id) || "").toLowerCase().indexOf(q) < 0) return false;
      return true;
    });
    if (!list.length) { $("list").innerHTML = '<div class="empty">' + (keys.length ? "ไม่พบคีย์ที่ตรงกับตัวกรอง" : "ยังไม่มีคีย์ เลือกระยะเวลาด้านบนแล้วกดสร้างคีย์") + "</div>"; return; }
    $("list").innerHTML = list.map(function (k) {
      var st = status(k, now);
      var label = st === "active" ? "ยังไม่หมดอายุ" : st === "expired" ? "หมดอายุแล้ว" : "ถาวร";
      var html = '<div class="key ' + st + '" data-id="' + k.id + '" data-st="' + st + '">' +
        '<div class="top"><span class="code">' + esc(k.key) + '</span><span class="badge ' + st + '">' + label + "</span></div>" +
        '<div class="meta">แพ็กเกจ <strong>' + (k.days ? k.days + " วัน" : "ถาวร") + "</strong>" + (k.note ? " · " + esc(k.note) : "") + "</div>" +
        '<div class="meta">สร้างเมื่อ ' + fmt(k.createdAt) + "</div>" +
        (k.lock
          ? '<div class="dev locked">ล็อกกับ HWID <strong>' + esc(k.lock.id) + "</strong> ตั้งแต่ " + fmt(k.lock.boundAt) + "</div>"
          : '<div class="dev">ยังไม่มีคนใช้ ยังไม่ล็อกเครื่อง</div>');
      if (st === "active") {
        html += '<div class="meta">หมดอายุ <strong>' + fmt(k.expiresAt) + '</strong></div>' +
          '<div class="meta">เหลือ <strong class="left">' + dur(k.expiresAt - now) + "</strong></div>" +
          '<div class="bar"><i style="width:' + pct(k, now) + '%"></i></div>';
      } else if (st === "expired") {
        html += '<div class="meta">หมดอายุเมื่อ <strong>' + fmt(k.expiresAt) + "</strong> (" + ago(now - k.expiresAt) + ")</div>";
      } else html += '<div class="meta">ไม่มีวันหมดอายุ</div>';
      html += '<div class="actions"><button class="btn ghost small" data-a="copy">คัดลอก</button>' +
        (k.days ? '<button class="btn ghost small" data-a="reset">รีเซ็ตเวลา</button>' : "") +
        (k.lock ? '<button class="btn ghost small" data-a="unbind">รีเซ็ตล็อก</button>' : "") +
        '<button class="btn ghost small" data-a="del">ลบ</button></div></div>';
      return html;
    }).join("");
  }

  $("tabs").addEventListener("click", function (e) { var b = e.target.closest(".tab"); if (!b) return; filter = b.dataset.f; render(); });
  $("search").addEventListener("input", function (e) { query = e.target.value; render(); });

  function act(method, path, okMsg) { api(method, path).then(function (j) { if (!j.ok) return toast(errMsg(j, "ไม่สำเร็จ")); toast(okMsg); load(); }); }
  $("list").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-a]"); if (!b) return;
    var id = b.closest(".key").dataset.id, k = keys.filter(function (x) { return x.id === id; })[0]; if (!k) return;
    var a = b.dataset.a;
    if (a === "copy") copy(k.key);
    else if (a === "del") confirmBox("ลบคีย์ " + k.key + " ?", function () { act("DELETE", "/api/keys/" + id, "ลบคีย์แล้ว"); });
    else if (a === "unbind") confirmBox("รีเซ็ตล็อก: ไฟล์คีย์ในเครื่องผู้เล่นจะใช้ไม่ได้ และสคริปต์จะให้ใส่คีย์ใหม่ (ผูกเครื่องใหม่ได้)", function () { act("POST", "/api/keys/" + id + "/reset-lock", "รีเซ็ตล็อกแล้ว"); });
    else if (a === "reset") confirmBox("รีเซ็ตเวลาคีย์นี้ให้เริ่มนับ " + k.days + " วัน ใหม่จากตอนนี้?", function () { act("POST", "/api/keys/" + id + "/reset-time", "รีเซ็ตเวลาแล้ว"); });
  });
  $("delExpired").onclick = function () {
    var n = counts(nowMs()).expired; if (!n) return toast("ไม่มีคีย์ที่หมดอายุ");
    confirmBox("ลบคีย์ที่หมดอายุทั้งหมด " + n + " คีย์?", function () { act("POST", "/api/keys/delete-expired", "ลบคีย์ที่หมดอายุแล้ว"); });
  };
  $("resetAll").onclick = function () {
    confirmBox("รีเซ็ตระบบ: ลบคีย์ทั้งหมด ย้อนกลับไม่ได้", function () {
      filter = "all"; query = ""; selected = 1; $("search").value = ""; $("note").value = ""; $("qty").value = 1; renderChips();
      act("DELETE", "/api/keys", "รีเซ็ตระบบแล้ว");
    });
  };

  // live countdown; re-render when a key changes status
  setInterval(function () {
    if (document.body.classList.contains("locked")) return;
    var now = nowMs(), changed = false, cards = document.querySelectorAll(".key");
    for (var i = 0; i < cards.length; i++) {
      var el = cards[i], k = keys.filter(function (x) { return x.id === el.dataset.id; })[0];
      if (!k) continue;
      if (status(k, now) !== el.dataset.st) { changed = true; break; }
      var left = el.querySelector(".left");
      if (left) { left.textContent = dur(k.expiresAt - now); el.querySelector(".bar i").style.width = pct(k, now) + "%"; }
    }
    if (changed) render();
  }, 1000);

  // ---------- 2-layer login ----------
  var step = 0, ticket = null;
  $("gateLogo").src = document.querySelector(".logo").src;
  function showStep() {
    $("gTitle").textContent = "ด่านที่ " + (step + 1) + " จาก 2";
    $("gHint").textContent = step ? "ใส่คีย์ชั้นที่สอง" : "ใส่คีย์ชั้นแรก";
    $("gBtn").textContent = step ? "เข้าสู่ระบบ" : "ถัดไป";
    $("s2").className = step ? "on" : "";
    $("gIn").value = ""; $("gErr").textContent = ""; $("gIn").focus();
  }
  var pingTries = 0, pingTimer = null;
  function ping() {
    clearTimeout(pingTimer);
    var c = $("conn");
    function fail(why) {
      c.className = "conn no"; c.textContent = "ยังเชื่อมต่อเซิร์ฟเวอร์คีย์ไม่ได้ (" + why + ") กำลังลองใหม่...";
      if (++pingTries < 24) pingTimer = setTimeout(ping, 5000); else c.textContent = "เชื่อมต่อเซิร์ฟเวอร์คีย์ไม่ได้ (" + why + ") เช็กว่าโฮสต์รัน server.js อยู่และตั้ง ADMIN_KEY1/ADMIN_KEY2 แล้ว";
    }
    fetch("/api/ping").then(function (r) {
      return r.json().then(function (j) {
        if (j && j.ok) { c.className = "conn ok"; c.textContent = "เชื่อมต่อเซิร์ฟเวอร์คีย์แล้ว"; pingTries = 0; }
        else fail("HTTP " + r.status);
      }, function () { fail("HTTP " + r.status + " ไม่ใช่เซิร์ฟเวอร์คีย์"); });
    }, function () { fail("ติดต่อไม่ได้"); });
  }
  function bad(msg) {
    $("gErr").textContent = msg;
    var b = $("gBox"); b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake");
    $("gIn").value = ""; $("gIn").focus();
  }
  function relock() {
    TOKEN = null; try { sessionStorage.removeItem("rh.token"); } catch (e) {}
    clearInterval(loadTimer); step = 0; ticket = null; keys = [];
    document.body.classList.add("locked"); showStep();
  }
  var sending = false;
  function submit() {
    var v = $("gIn").value; if (!v || sending) return;
    sending = true;
    var req = step === 0 ? api("POST", "/api/admin/step1", { k: v }) : api("POST", "/api/admin/step2", { ticket: ticket, k: v });
    req.then(function (j) {
      sending = false;
      if (!j.ok) { if (j.restart) { step = 0; showStep(); } return bad(errMsg(j, "คีย์ไม่ถูกต้อง")); }
      if (step === 0) { ticket = j.ticket; step = 1; showStep(); }
      else {
        TOKEN = j.token; try { sessionStorage.setItem("rh.token", TOKEN); } catch (e) {}
        document.body.classList.remove("locked"); startLoading();
      }
    });
  }
  $("gBtn").onclick = submit;
  $("gIn").addEventListener("keydown", function (e) { if (e.key === "Enter") submit(); });
  $("lockPage").onclick = function () { api("POST", "/api/admin/logout").then(function () { relock(); }); };

  renderChips();
  if (TOKEN) { document.body.classList.remove("locked"); startLoading(); } else { showStep(); ping(); }
})();

// sakura petals
(function () {
  var c = document.getElementById("sakura"), x = c.getContext("2d");
  var W, H, petals = [], dpr = Math.min(window.devicePixelRatio || 1, 2);
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var COLORS = ["255,183,200", "255,208,220", "247,150,180", "255,225,232"];
  function size() {
    W = window.innerWidth; H = window.innerHeight;
    c.width = W * dpr; c.height = H * dpr; x.setTransform(dpr, 0, 0, dpr, 0, 0);
    var n = Math.round(Math.min(70, Math.max(26, W * H / 16000)));
    while (petals.length < n) petals.push(make(true));
    petals.length = n;
  }
  function make(anywhere) {
    return {
      x: Math.random() * W, y: anywhere ? Math.random() * H : -20,
      s: 4.5 + Math.random() * 6, vy: 0.45 + Math.random() * 0.9, vx: 0.2 + Math.random() * 0.6,
      sw: Math.random() * 6.28, swS: 0.01 + Math.random() * 0.02, rot: Math.random() * 6.28, rotS: (Math.random() - 0.5) * 0.04,
      flip: Math.random() * 6.28, flipS: 0.02 + Math.random() * 0.03,
      o: 0.5 + Math.random() * 0.4, col: COLORS[(Math.random() * COLORS.length) | 0]
    };
  }
  function petal(p) {
    var s = p.s;
    x.save(); x.translate(p.x, p.y); x.rotate(p.rot); x.scale(1, 0.35 + Math.abs(Math.cos(p.flip)) * 0.65);
    x.beginPath();
    x.moveTo(0, s);
    x.bezierCurveTo(-s * 1.1, s * 0.2, -s * 0.7, -s, -s * 0.14, -s * 0.9);
    x.lineTo(0, -s * 0.66); x.lineTo(s * 0.14, -s * 0.9);
    x.bezierCurveTo(s * 0.7, -s, s * 1.1, s * 0.2, 0, s);
    x.closePath();
    x.fillStyle = "rgba(" + p.col + "," + p.o + ")";
    x.shadowColor = "rgba(255,150,180,.55)"; x.shadowBlur = 6;
    x.fill(); x.restore();
  }
  function frame() {
    x.clearRect(0, 0, W, H);
    for (var i = 0; i < petals.length; i++) {
      var p = petals[i];
      if (!reduce) {
        p.sw += p.swS; p.flip += p.flipS; p.rot += p.rotS;
        p.y += p.vy; p.x += p.vx + Math.sin(p.sw) * 0.9;
        if (p.y > H + 20 || p.x > W + 30) { petals[i] = make(false); petals[i].x = Math.random() * W * 0.9 - W * 0.1; continue; }
      }
      petal(p);
    }
    if (!reduce) requestAnimationFrame(frame);
  }
  size(); window.addEventListener("resize", size); frame();
})();

</script>
